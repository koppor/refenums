name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Package list generated with depp (gitlab.com/islandoftex/texmf/depp) in the Island of TeX image, plus latex-bin for pdflatex and amsfonts + cm-super for fonts depp cannot see (loaded after \begin{document})
      - uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - run: pdflatex -interaction=nonstopmode -halt-on-error demo && pdflatex -interaction=nonstopmode -halt-on-error demo
      - if: github.event_name == 'push'
        run: mkdir pages && cp demo.pdf pages/
      # Force-pushes a single commit, so gh-pages keeps no history
      - if: github.event_name == 'push'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: pages
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jbangdev/jbang-action@v0.142.0
        with:
          script: com.github.nbbrd.heylogs:heylogs-cli:0.19.1:bin
          scriptargs: check CHANGELOG.md --format github-actions
